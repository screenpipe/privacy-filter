# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
# CPU-only PII service. Generative model routes are intentionally not exposed.
cvm-version: 0.11.0
cpus: 8
memory: 16384
gpus: 0

containers:
  - name: privacy-filter
    image: "ghcr.io/screenpipe/privacy-filter:0.10.0-cpu.rc1@sha256:c303fb570ee5f3e1af88bc7ee54101979fdaac020855bbe7c490b5e30a43933f"
    user: "10001:999"
    env:
      - PORT: "8080"
      - HOME: "/home/appuser"
      - PRIVACY_ONLY: "true"
      - ORT_NUM_THREADS: "4"
    tmpfs:
      /tmp: size=256m,mode=1777
      /home/appuser: size=64m,mode=0700,uid=10001,gid=999
    restart: "always"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: "15s"
      timeout: "5s"
      retries: 10
      start_period: "120s"

shim:
  upstream-port: 8080
  # Same public PII routes as before; no chat or model proxy routes.
  authenticated: false
  paths:
    - /health
    - /filter
    - /image/detect
