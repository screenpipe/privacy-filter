# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
name: Build and Attest

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Prepare artifact mount
        run: |
          mkdir -p output
          # The official measurer drops DAC_OVERRIDE. Only its artifact mount
          # needs to accept writes from the restricted container user.
          chmod 0777 output
      # Tinfoil's control plane validates this official action invocation.
      # Pin the same v0.8.2 measurement implementation used for this CVM.
      - name: Measure, attest, and create candidate
        uses: tinfoilsh/measure-image-action@9733d724326dd6b476335ec513210861894d4cb2 # v0.8.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: "false"
      - name: Keep candidate out of production release selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_REF" --prerelease
