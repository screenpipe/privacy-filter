name: GLM runtime image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without the v prefix"
        required: true
        type: string
      source:
        description: "Optional exact privacy-filter-glm image to promote into the public privacy-filter package"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ inputs.source == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate image version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "invalid image version: $VERSION" >&2
            exit 1
          fi

      - name: Free runner disk space
        uses: ggml-org/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out the tested REAP-50 runtime
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: patrickbdevaney/llama.cpp
          ref: 2a4a41238175cc5d0ee3e591865653e49096c782
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push H200 CUDA server
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/screenpipe/privacy-filter:glm-${{ inputs.version }}
          build-args: |
            CUDA_VERSION=12.8.1
            CUDA_DOCKER_ARCH=90

      - name: Print pinned image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: echo "ghcr.io/screenpipe/privacy-filter:glm-${VERSION}@${DIGEST}"

  promote:
    if: ${{ inputs.source != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate exact source image
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          EXPECTED="ghcr.io/screenpipe/privacy-filter-glm:${VERSION}@"
          if [[ ! "$SOURCE" =~ ^ghcr\.io/screenpipe/privacy-filter-glm:[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid source image" >&2
            exit 1
          fi
          if [[ "$SOURCE" != "${EXPECTED}"* ]]; then
            echo "source version does not match requested version" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote into the existing public package
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          TARGET="ghcr.io/screenpipe/privacy-filter:glm-${VERSION}"
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          docker buildx imagetools inspect "$TARGET"
